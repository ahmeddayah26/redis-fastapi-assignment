apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: python-api
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/ahmeddayah26/redis-fastapi-assignment.git

    targetRevision: main

    path: helm/python-api

    helm:
      valueFiles:
        - values.yaml


  destination:
    server: https://kubernetes.default.svc

    namespace: default


  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:
      - CreateNamespace=true
